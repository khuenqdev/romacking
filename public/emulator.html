<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emulator</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            overscroll-behavior: none; 
            -webkit-overflow-scrolling: touch;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game { width: 100%; height: 100%; display: none; }
        
        /* Custom iOS-safe start screen */
        #start-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #111827;
            z-index: 10;
        }
        #start-btn {
            background-color: #9333ea;
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(147, 51, 234, 0.4);
            transition: transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #start-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    
    <div id="start-overlay">
        <button id="start-btn">Tap to Play</button>
    </div>
    
    <div id="game"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        document.getElementById('start-btn').addEventListener('click', function() {
            // 1. Hide the overlay and show the game div
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('game').style.display = 'block';

            // 2. Set up EmulatorJS variables
            window.EJS_player = '#game';
            window.EJS_core = urlParams.get('core'); 
            
            // Force Absolute ROM URL for Safari
            const relativeRom = urlParams.get('rom');
            window.EJS_gameUrl = new URL(relativeRom, window.location.href).href;
            
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            
            // Because we are inside a 'click' event, it is 100% safe to auto-start!
            window.EJS_startOnLoaded = true; 

            // 3. Dynamically load the EmulatorJS script ONLY after tapping
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
