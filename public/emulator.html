<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emulator</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            overscroll-behavior: none; 
            -webkit-overflow-scrolling: touch;
        }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        window.EJS_player = '#game';
        window.EJS_core = urlParams.get('core'); 
        
        const relativeRom = urlParams.get('rom');
        window.EJS_gameUrl = new URL(relativeRom, window.location.href).href;
        
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // ---------------------------------------------------
        // OFFICIAL EMULATORJS UI OPTIONS
        // https://emulatorjs.org/docs/options#ui-options
        // ---------------------------------------------------
        
        // Changes the accent color of menus, active states, and touch controls 
        // to match your Tailwind Next.js theme (Purple-600)
        window.EJS_color = '#9333ea'; 
        
        // Sets the loading and start screen background color 
        // to match your app's dark background (Gray-900)
        window.EJS_backgroundColor = '#111827'; 
        
        // Centers the big red "Play" button vertically and horizontally
        window.EJS_alignStartButton = 'center'; 
        
        // (Optional) Cleans up the toolbar menu by hiding settings you might not want on a web app
        window.EJS_hideSettings = ['shader', 'fps', 'netplay']; 
        
        // (Optional) Forces the start screen to wait for the user to explicitly tap, 
        // which prevents iOS WebAudio API crashes
        window.EJS_startOnLoaded = false;
    </script>
    
    <!-- Load EmulatorJS normally so it catches the window.onload event -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
