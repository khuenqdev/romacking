<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Romacking Emulator</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        #game { width: 100%; height: 100%; }
        
        #debug-log {
            display: none;
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            background: #b91c1c;
            color: white;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            z-index: 999999;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
    <!-- Eruda Mobile DevTools for live debugging on iOS -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
</head>
<body>
    <div id="debug-log"></div>
    <div id="game"></div>

    <script>
        // Only load the mobile console icon on iOS devices
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            eruda.init();
        }

        function showError(msg) {
            const el = document.getElementById('debug-log');
            el.style.display = 'block';
            el.textContent = msg;
        }

        window.onerror = function(msg, url, line) {
            showError(`Runtime Error:\n${msg}\nLine: ${line}\nSource: ${url}`);
        };

        // Resume AudioContext on first iOS user touch
        const unlockAudio = () => {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
            }
        };
        window.addEventListener('touchstart', unlockAudio, { once: true });
        window.addEventListener('click', unlockAudio, { once: true });

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const core = urlParams.get('core');
            const relativeRom = urlParams.get('rom');

            if (!relativeRom) {
                showError("Configuration Error: No ROM path specified in URL parameters.");
                return;
            }

            // Calculate absolute HTTPS URL
            const resolvedRomUrl = new URL(relativeRom, window.location.href).href;

            try {
                // 1. Verify ROM is reachable
                const res = await fetch(resolvedRomUrl);
                if (!res.ok) {
                    showError(`[HTTP ${res.status}] Failed to fetch ROM from:\n${resolvedRomUrl}`);
                    return;
                }

                // 2. Verify payload is not an HTML 404 page
                const blob = await res.blob();
                if (blob.size < 300) {
                    const sample = await blob.text();
                    if (sample.includes("<!DOCTYPE") || sample.includes("<html")) {
                        showError(`Error: Server returned an HTML 404 page instead of a ROM.\nURL: ${resolvedRomUrl}`);
                        return;
                    }
                }

                // 3. Configure EmulatorJS
                window.EJS_player = '#game';
                window.EJS_core = core;
                
                // FIX: Pass the real HTTPS URL directly so Web Workers on iOS can fetch it
                window.EJS_gameUrl = resolvedRomUrl;
                
                window.EJS_gameName = relativeRom.split('/').pop().split('.')[0];
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                window.EJS_startOnLoaded = true;

                // 4. Mount loader
                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                document.body.appendChild(script);

            } catch (err) {
                showError(`Network/CORS Error:\n${err.message}\n\nTarget: ${resolvedRomUrl}`);
            }
        }

        init();
    </script>
</body>
</html>
