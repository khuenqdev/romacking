<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Romacking Emulator</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        #game { width: 100%; height: 100%; }
        
        /* ---------------------------------------------------
           NEON GLASSMORPHISM THEME (CSS OVERRIDES)
        --------------------------------------------------- */
        
        /* 1. Base style for all text buttons (A, B, Start, Select) */
        .ejs_virtualGamepad_button {
            background: rgba(147, 51, 234, 0.15) !important;
            border: 2px solid rgba(147, 51, 234, 0.6) !important;
            color: #e9d5ff !important; /* Tailwind purple-200 */
            box-shadow: 0 0 12px rgba(147, 51, 234, 0.4), inset 0 0 8px rgba(147, 51, 234, 0.2) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important; /* iOS support */
            transition: all 0.1s ease !important;
            text-shadow: 0 0 5px rgba(147, 51, 234, 0.8) !important;
            /* Disable text selection on touch */
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        /* 2. Active (Touched) state for buttons */
        .ejs_virtualGamepad_button:active {
            background: rgba(147, 51, 234, 0.5) !important;
            box-shadow: 0 0 20px rgba(147, 51, 234, 1), inset 0 0 15px rgba(147, 51, 234, 0.6) !important;
            transform: scale(0.9) !important;
        }

        /* 3. Make A, B, X, Y buttons perfectly circular */
        .b_a, .b_b, .b_x, .b_y {
            border-radius: 50% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* 4. Make Start/Select look like modern pills */
        .b_start, .b_select, .b_speed_fast, .b_speed_slow {
            border-radius: 20px !important;
        }

        /* 5. D-Pad Styling */
        .ejs_dpad_bar {
            background: rgba(147, 51, 234, 0.2) !important;
            border: 2px solid rgba(147, 51, 234, 0.6) !important;
            box-shadow: 0 0 12px rgba(147, 51, 234, 0.4) !important;
            border-radius: 8px !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
        }

        /* 6. Settings/Menu SVG Icon */
        .ejs_virtualGamepad_open svg {
            fill: #d8b4fe !important;
            filter: drop-shadow(0px 0px 8px rgba(147, 51, 234, 0.8)) !important;
        }

        #debug-log {
            display: none;
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            background: #b91c1c;
            color: white;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            z-index: 999999;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
    <!-- Kept eruda for iOS debugging just in case -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script> -->
</head>
<body>
    <div id="debug-log"></div>
    <div id="game"></div>

    <script>
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            eruda.init();
        }

        function showError(msg) {
            const el = document.getElementById('debug-log');
            el.style.display = 'block';
            el.textContent = msg;
        }

        window.onerror = function(msg, url, line) {
            showError(`Runtime Error:\n${msg}\nLine: ${line}\nSource: ${url}`);
        };

        const unlockAudio = () => {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
            }
        };
        window.addEventListener('touchstart', unlockAudio, { once: true });
        window.addEventListener('click', unlockAudio, { once: true });

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const core = urlParams.get('core');
            const relativeRom = urlParams.get('rom');

            if (!relativeRom) {
                showError("Configuration Error: No ROM path specified.");
                return;
            }

            const resolvedRomUrl = new URL(relativeRom, window.location.href).href;

            try {
                const res = await fetch(resolvedRomUrl);
                if (!res.ok) {
                    showError(`[HTTP ${res.status}] Failed to fetch ROM.`);
                    return;
                }

                const blob = await res.blob();
                if (blob.size < 300) {
                    const sample = await blob.text();
                    if (sample.includes("<!DOCTYPE") || sample.includes("<html")) {
                        showError(`Error: Server returned an HTML page instead of a ROM.`);
                        return;
                    }
                }

                window.EJS_player = '#game';
                window.EJS_core = core;
                window.EJS_gameUrl = resolvedRomUrl;
                window.EJS_gameName = relativeRom.split('/').pop().split('.')[0];
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                window.EJS_startOnLoaded = true;

                // EmualtorJS UI Config
                window.EJS_color = '#9333ea';
                window.EJS_backgroundColor = '#111827';
                window.EJS_alignStartButton = 'center';

                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                document.body.appendChild(script);

            } catch (err) {
                showError(`Network/CORS Error:\n${err.message}`);
            }
        }

        init();
    </script>
</body>
</html>
