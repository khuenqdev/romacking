<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Romacking Emulator</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            overscroll-behavior: none; 
            -webkit-overflow-scrolling: touch;
        }
        #game { width: 100%; height: 100%; }
    </style>
    <!-- Eruda Mobile DevTools -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
</head>
<body>
    <div id="game"></div>

    <script>
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            eruda.init();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const core = urlParams.get('core');
        
        window.EJS_player = '#game';
        window.EJS_core = core; 
        
        // Resolve absolute URL for the ROM
        const relativeRom = urlParams.get('rom');
        window.EJS_gameUrl = new URL(relativeRom, window.location.href).href;
        
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // UI & Theme settings
        window.EJS_color = '#9333ea';
        window.EJS_backgroundColor = '#111827';
        window.EJS_startOnLoaded = true;
        
        // -------------------------------------------------------------
        // FIX 1: DISABLE REGIONAL LOCALIZATION AUTO-DETECTION
        // Prevents the browser from requesting non-existent en-GB.json
        // -------------------------------------------------------------
        window.EJS_disableAutoLang = true;
        window.EJS_language = 'en-US';

        window.EJS_defaultOptions = {};
        // if (core === 'nes') {
        //     window.EJS_defaultOptions['shader'] = 'crt-geom.glslp';
        // }

        // -------------------------------------------------------------
        // FIX 2: SAFE NETWORK SEQUENCING (NO DEADLOCKS)
        // -------------------------------------------------------------
        function waitForCoreReady() {
            return new Promise((resolve) => {
                const check = () => {
                    const coreReady = document.querySelector('script[src*="emulator.js"]') || 
                                      document.querySelector('script[src*="cores"]') ||
                                      window.EJS_emulator;
                    if (coreReady) {
                        setTimeout(resolve, 200);
                    } else {
                        setTimeout(check, 40);
                    }
                };
                setTimeout(resolve, 1500); // Safety fallback
                check();
            });
        }

        // 1. Intercept fetch()
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const url = args[0] ? args[0].toString() : '';
            const options = args[1] || {};
            const method = (options.method || 'GET').toUpperCase();

            // Catch any rogue localization file request and return empty JSON immediately
            if (url.includes('/localization/')) {
                return new Response('{}', {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                });
            }

            // CRITICAL FIX: Only delay GET requests (downloading ROM data).
            // NEVER delay HEAD requests (checking IndexedDB cache headers)!
            if (method === 'GET' && url.match(/\.(nes|gb|gbc|gba)($|\?)/i)) {
                await waitForCoreReady();
            }

            return originalFetch.apply(this, args);
        };

        // 2. Intercept XMLHttpRequest
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            this._method = (method || 'GET').toUpperCase();
            this._url = url ? url.toString() : '';
            return originalOpen.call(this, method, url, ...rest);
        };
        XMLHttpRequest.prototype.send = function(...args) {
            // NEVER delay HEAD requests!
            if (this._method === 'GET' && this._url && this._url.match(/\.(nes|gb|gbc|gba)($|\?)/i)) {
                waitForCoreReady().then(() => {
                    originalSend.apply(this, args);
                });
                return;
            }
            return originalSend.apply(this, args);
        };
    </script>
    
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
