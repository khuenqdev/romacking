<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Romacking Emulator</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        #game { width: 100%; height: 100%; }
        
        /* ---------------------------------------------------
           CUSTOM THEME INJECTION: NEON GLASSMORPHISM
           EmulatorJS dynamically injects its virtual gamepad. 
           We target its SVGs and touch areas globally. 
        --------------------------------------------------- */
        
        /* Add a soft purple neon glow to all on-screen control SVGs */
        #game svg {
            filter: drop-shadow(0px 0px 8px rgba(147, 51, 234, 0.6));
            transition: all 0.2s ease-in-out;
        }
        
        /* When a button is touched, make it glow brighter */
        #game svg:active {
            filter: drop-shadow(0px 0px 15px rgba(147, 51, 234, 1));
            transform: scale(0.95);
        }

        #debug-log {
            display: none;
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            background: #b91c1c;
            color: white;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            z-index: 999999;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
</head>
<body>
    <div id="debug-log"></div>
    <div id="game"></div>

    <script>
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            eruda.init();
        }

        function showError(msg) {
            const el = document.getElementById('debug-log');
            el.style.display = 'block';
            el.textContent = msg;
        }

        window.onerror = function(msg, url, line) {
            showError(`Runtime Error:\n${msg}\nLine: ${line}\nSource: ${url}`);
        };

        const unlockAudio = () => {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
            }
        };
        window.addEventListener('touchstart', unlockAudio, { once: true });
        window.addEventListener('click', unlockAudio, { once: true });

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const core = urlParams.get('core');
            const relativeRom = urlParams.get('rom');

            if (!relativeRom) {
                showError("Configuration Error: No ROM path specified.");
                return;
            }

            const resolvedRomUrl = new URL(relativeRom, window.location.href).href;

            try {
                const res = await fetch(resolvedRomUrl);
                if (!res.ok) {
                    showError(`[HTTP ${res.status}] Failed to fetch ROM.`);
                    return;
                }

                const blob = await res.blob();
                if (blob.size < 300) {
                    const sample = await blob.text();
                    if (sample.includes("<!DOCTYPE") || sample.includes("<html")) {
                        showError(`Error: Server returned an HTML page instead of a ROM.`);
                        return;
                    }
                }

                window.EJS_player = '#game';
                window.EJS_core = core;
                window.EJS_gameUrl = resolvedRomUrl;
                window.EJS_gameName = relativeRom.split('/').pop().split('.')[0];
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                window.EJS_startOnLoaded = true;

                // ---------------------------------------------------
                // EMULATORJS NATIVE UI SETTINGS
                // ---------------------------------------------------
                window.EJS_color = '#9333ea';             // Accent color (Tailwind purple-600)
                window.EJS_backgroundColor = '#111827';   // Loading screen color (Tailwind gray-900)
                window.EJS_alignStartButton = 'center';   // Moves the "Play" button to the exact center

                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                document.body.appendChild(script);

            } catch (err) {
                showError(`Network/CORS Error:\n${err.message}`);
            }
        }

        init();
    </script>
</body>
</html>
