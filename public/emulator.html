<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Romacking Emulator</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            overscroll-behavior: none; 
            -webkit-overflow-scrolling: touch;
        }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const core = urlParams.get('core');
        
        window.EJS_player = '#game';
        window.EJS_core = core; 
        
        // Resolve absolute URL for the ROM
        const relativeRom = urlParams.get('rom');
        window.EJS_gameUrl = new URL(relativeRom, window.location.href).href;
        
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // UI & Theme settings
        window.EJS_color = '#9333ea';
        window.EJS_backgroundColor = '#111827';
        
        // Immediately start the game on load (bypasses Start/Play screen)
        window.EJS_startOnLoaded = true;
        
        // Initialize default options
        window.EJS_defaultOptions = {};

        // Apply "CRT Geom" as default shader for NES games
        // if (core === 'nes') {
        //     window.EJS_defaultOptions['shader'] = 'crt-lottes';
        // }
    </script>
    
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
